policy_version: money_management_v1
shariah_universe_path: configs/market_data/nifty_500_shariah.yaml
sleeves:
  - sleeve_id: core_shariah
    name: Core Shariah equity basket
    target_weight_pct: 40.0
    role: Conservative diversified equity anchor from the Shariah universe.
  - sleeve_id: active_strategy
    name: Active strategy
    target_weight_pct: 35.0
    role: Main alpha sleeve for graph-aware paper signals.
    drawdown_reduce_threshold_pct: 6.0
    drawdown_freeze_threshold_pct: 10.0
  - sleeve_id: diversifying_strategy
    name: Diversifying strategy
    target_weight_pct: 15.0
    role: Secondary style sleeve after backtest validation.
    drawdown_reduce_threshold_pct: 5.0
    drawdown_freeze_threshold_pct: 8.0
  - sleeve_id: experimental_models
    name: Experimental models
    target_weight_pct: 5.0
    role: Small-risk sleeve for new model candidates.
    drawdown_reduce_threshold_pct: 2.0
    drawdown_freeze_threshold_pct: 4.0
    new_entry_risk_cap_pct_nav: 0.25
  - sleeve_id: cash_buffer
    name: Cash/risk buffer
    target_weight_pct: 5.0
    role: Operational cash, gap/drawdown protection, and new opportunity reserve.
strategy_mappings:
  - strategy_name: core_shariah_basket_v1
    sleeve_id: core_shariah
  - strategy_name: graph_aware_score_v1
    sleeve_id: active_strategy
  - strategy_name: graph_aware_score_v2
    sleeve_id: active_strategy
  - strategy_name: moving_average_crossover_v1
    sleeve_id: active_strategy
  - strategy_name: blended_score_v1
    sleeve_id: diversifying_strategy
  - strategy_name: experimental_score_v1
    sleeve_id: experimental_models
limits:
  max_stock_pct_nav: 5.0
  max_stock_hard_cap_pct_nav: 7.5
  max_sector_pct_nav: 25.0
  max_graph_cluster_pct_nav: 35.0
  max_open_positions: 20
trade_risk:
  normal_trade_risk_pct_nav: 0.50
  strong_trade_risk_pct_nav: 0.75
  max_single_trade_risk_pct_nav: 1.00
  max_total_open_trade_risk_pct_nav: 5.00
allocation_scoring:
  weights:
    strategy_score: 0.30
    trader_confidence: 0.25
    liquidity: 0.15
    volatility: 0.15
    diversification: 0.10
    recent_sleeve_performance: 0.05
  score_bands:
    reject_below: 60.0
    half_normal_below: 75.0
    normal_below: 85.0
drawdown_governors:
  - name: portfolio_caution
    drawdown_pct: 3.0
    action: reduce_new_position_sizes_25_pct
  - name: portfolio_defensive
    drawdown_pct: 5.0
    action: reduce_new_position_sizes_50_pct
  - name: experimental_freeze
    drawdown_pct: 8.0
    action: stop_experimental_new_entries
  - name: portfolio_freeze
    drawdown_pct: 10.0
    action: freeze_new_buys_allow_exits
rebalance:
  sleeve_drift_threshold_pct: 20.0
  min_rebalance_notional_inr: 5000
  min_trade_drift_pct_nav: 0.50
  score_below_exit_threshold: -0.20
  score_below_trim_threshold: 0.00
  over_hard_cap_trim_enabled: true
  stale_unmapped_exit_enabled: true
  review_frequency: daily_after_close
  core_rebalance_frequency: monthly
rebalance_capacity:
  hard_cash_reserve_pct_nav: 5.0
  same_run_proceeds_haircut_pct: 80.0
  buy_price_buffer_pct: 5.0
  soft_borrowing_enabled: true
  borrowable_sleeve_ids:
    - diversifying_strategy
    - experimental_models
    - core_shariah
  borrower_sleeve_ids:
    - active_strategy
  # Extra capacity active_strategy may borrow on top of its 35% target; 60.0 means 35% + 60% = 95% max active capacity.
  max_borrowed_capacity_pct_nav: 20.0
  max_borrowed_capacity_inr:
  repay_priority_sleeve_ids:
    - core_shariah
    - diversifying_strategy
    - experimental_models
  metadata:
    return_priority_note: Borrowed idle capacity should be returned before new borrower deployments when future executable routing uses this model.
